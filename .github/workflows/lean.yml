name: lean
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate lake-manifest.json if missing
        if: hashFiles('lean/lake-manifest.json') == ''
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          cd lean && "$HOME/.elan/bin/lake" update
          echo "----- BEGIN lake-manifest.json -----"; cat lake-manifest.json; echo "----- END lake-manifest.json -----"
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          use-mathlib-cache: true
      - name: Reject unfinished proofs
        run: |
          if grep -rnE '\b(sorry|admit)\b|^\s*axiom ' lean/Discovery lean/Discovery.lean; then
            echo "sorry/admit/axiom found"; exit 1; fi
      - name: Check axioms used by every theorem
        run: |
          cd lean
          lake env lean AxiomCheck.lean | tee axioms.txt
          test "$(grep -c "depends on axioms\|does not depend on any axioms" axioms.txt)" -eq 5
          if grep -oE "axioms: \[[^]]*\]" axioms.txt | tr -d '[]' | tr ',' '\n' | sed 's/.*axioms: //' | tr -d ' ' | grep -vxE 'propext|Classical.choice|Quot.sound|'; then
            echo "non-standard axiom used"; exit 1; fi
